# Game Theory Trading Dashboard — all tunables live here.
# Restart the session after editing (or call engine.reload_config()).

symbol_default: BTCUSDT
timeframe_default: "15m"
timeframes: ["1m", "5m", "15m", "1h", "4h", "1d"]

binance:
  rest_base: "https://fapi.binance.com"
  # 2026 USD-M public market path. Legacy /ws and /stream time out.
  ws_combined: "wss://fstream.binance.com/market/stream"
  ws_raw: "wss://fstream.binance.com/market/ws"
  # Depth / bookTicker are high-frequency PUBLIC streams (not /market).
  ws_public_combined: "wss://fstream.binance.com/public/stream"
  request_timeout_s: 12
  rest_retries: 3
  rest_backoff_s: 0.6
  # REST poll intervals (seconds)
  oi_poll_s: 3.0
  premium_poll_s: 5.0
  ticker_poll_s: 10.0
  hist_poll_s: 60.0
  kline_seed_limit: 300
  funding_hist_limit: 200
  oi_hist_limit: 100
  agg_trade_seed: 500

buffers:
  max_trades: 25000
  max_liquidations: 3000
  max_score_rows: 2500
  max_oi_rows: 4000
  max_funding_rows: 2000
  max_cvd_rows: 4000
  footprint_bars: 48

stale_after_s:
  price: 8
  trades: 8
  oi: 20
  funding: 20
  kline: 90
  orderbook: 8
  # Liquidations are event-driven. No event != stale if the socket is up.
  liquidation_socket: 15

storage:
  dir: data
  duckdb_file: data/market.duckdb
  parquet_dir: data/parquet
  flush_every_s: 15
  retain_days: 14

footprint:
  # bucket = tick_size * tick_multiplier
  tick_multiplier: 1
  # auto-widen buckets if more than max_levels would appear
  max_levels: 40
  stacked_imbalance_ratio: 3.0
  stacked_min_levels: 3

divergence:
  swing_lookback: 5
  min_swings: 2
  # price must make a higher high of at least this % of price
  min_price_hh_pct: 0.04
  min_price_ll_pct: 0.04
  # CVD "fails to confirm" if it does not exceed prior swing by this fraction
  # of the prior swing's absolute CVD magnitude (0 = any non-HH / non-LL)
  cvd_confirm_frac: 0.0
  # require the two swings to be at least this many bars apart
  min_swing_gap_bars: 3

absorption:
  lookback_s: 180
  # |delta| must exceed this fraction of lookback volume
  min_delta_frac_of_volume: 0.18
  # price progress (abs) must be below this fraction of recent ATR
  max_progress_atr: 0.35
  atr_bars: 14
  large_imbalance_frac: 0.30

cascade:
  lookback_s: 180
  oi_drop_ref_pct: 0.35
  liq_spike_vs_median: 4.0
  price_accel_ref_pct: 0.25
  enter: 70
  exit: 50

# Gating: confirmation is structure+flow, not the 0-100 confirm score.
# Liquidation EVENT (any print) is not forced-flow. Significance is normalized
# vs OI and/or a rolling baseline — a fixed $50k print is not automatically
# meaningful on a large book.
gates:
  setup_watch: 70
  liq_min_notional: 25000            # below this = tiny event, never meaningful
  forced_flow_notional: 50000        # fallback floor ONLY when OI/baseline missing
  liq_to_oi_ratio: 0.0005            # 0.05% of OI USDT → meaningful
  liq_to_oi_extreme: 0.002           # 0.20% of OI USDT → extreme
  liq_spike_multiplier: 4.0          # vs rolling median 15m notional
  liq_spike_extreme: 8.0
  liq_significance_pctile: 80
  liq_extreme_pctile: 95
  liq_baseline_min_windows: 4
  cascade_min_observed_notional: 100000
  cascade_min_liq_to_oi: 0.001       # 0.10% of OI USDT

# Early-warning layer between LONG TRAP SETUP and LONG TRAP CONFIRMING.
# Does not replace the confirmation gate or the trade gate.
developing:
  early_price_reversal_pct: 0.20
  strong_early_price_reversal_pct: 0.40
  early_oi_unwind_5m_pct: -0.50
  threshold: 35.0
  strong_threshold: 50.0
  long_crowding_early_threshold: 50.0

squeeze:
  oi_drop_pct: 0.08
  price_move_pct: 0.08
  cvd_confirm: true

state_machine:
  min_dwell_s: 25
  setup_enter: 70
  setup_exit: 55
  confirm_enter: 65
  confirm_exit: 50
  absorption_enter: 60
  crowding_enter: 60

# Setup scores (must sum to 100)
# NOTE: weights have been trimmed twice (proportionally, rounded) to make
# room first for book_imbalance, then for taker_flow, below. Rebalance
# further to taste — the code doesn't require this to sum to exactly 100,
# but the dashboard's score display assumes a 0-100 scale by convention.
weights_setup:
  crowding: 11
  oi_behavior: 12
  funding: 8
  cvd_divergence: 16
  absorption: 16
  liquidation_risk: 13
  price_structure: 3
  book_imbalance: 9
  taker_flow: 10

# Confirmation scores (must sum to 100)
weights_confirm:
  support_break: 25
  oi_unwind: 20
  liquidation_flow: 25
  cvd_follow: 15
  acceleration: 15

scoring_refs:
  funding_high: 0.0005          # +0.05% per interval ≈ crowded
  oi_expand_pct: 0.40           # 0.40% / 15m is a large OI pop
  stall_gap_pct: 0.25
  liq_notional_ref: 250000.0    # USDT, 15m window, scale per symbol later
  near_extreme_pct: 0.15

orderbook:
  depth_stream_levels: 20        # matches <symbol>@depth20@100ms
  price_range_pct: 0.5           # band above/below best bid/ask to sum notional in
  thin_wall_ratio: 0.20          # ask (or bid) notional below this fraction of the
                                  # opposing side's notional in the same band = "thin wall"

grok:
  enabled: true
  exe: grok
  timeout_s: 90
  max_turns: 1

dashboard:
  refresh_s: 1.0
  chart_refresh_s: 2.0
  footprint_rows: 18
